/* 1) COLORES COMO VARIABLES: la página (fuera de la hoja) cambia en modo claro/oscuro.
      La hoja siempre mantiene sus colores rosados para que la imagen salga igual. */
:root{
  --bg:#f7efe9; --txt:#4a3340; --btn:#b98a9c; --btn-txt:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#241b20; --txt:#f3e4ea; --btn:#8a5d70;}
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

/* 2) BARRA DE BOTONES */
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px 10px}
.bar button{background:var(--btn);color:var(--btn-txt);border:0;border-radius:999px;padding:10px 18px;font-size:15px;cursor:pointer}
.msg{text-align:center;min-height:20px;font-size:14px;padding-bottom:6px}

/* 3) LA HOJA (lo que se convierte en imagen/PDF) */
.wrap{display:flex;justify-content:center;padding:0 10px 30px}
/* La hoja SIEMPRE se diseña a 735px y luego se reduce (scale) para caber en el celular */
.stage{width:min(100%,735px);overflow:hidden}
#sheet{
  width:735px;flex:none;transform-origin:top left;box-sizing:border-box;padding:22px;
  background:#fdf3ea;color:#2b2226;
  font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  display:grid;gap:14px;grid-template-columns:1fr 1fr;
}
.title{grid-column:1/3;text-align:center;padding:14px 8px;background:#c9b3d6;border:6px solid #b9a0cb;
  font:400 40px "Kaushan Script","Segoe Script",cursive}
.title b{font:600 1.05em "Fredoka",sans-serif;letter-spacing:3px;color:#c9b3d6;-webkit-text-stroke:5px #2b2226;paint-order:stroke fill}
.box{background:#e8b9ae;padding:10px 14px}
.box h3{margin:0 0 6px;font-weight:600;font-size:26px}
.left{display:flex;flex-direction:column;gap:12px}
.week{display:flex;gap:6px;justify-content:center}
.week button{width:34px;height:34px;border-radius:50%;border:0;font:600 15px "Fredoka",sans-serif;cursor:pointer;background:#d6c4e0;color:#2b2226}
.week button.on{background:#7a4f8d;color:#fff}
.full{grid-column:1/3}
.round{border-radius:40px;padding:16px 22px}

/* 4) LÍNEAS DE ESCRITURA: un degradado repetido dibuja una raya cada 28px,
      y el textarea usa la misma altura de línea para que el texto "caiga" sobre la raya. */
textarea,input[type=date]{width:100%;box-sizing:border-box;border:0;background:transparent;font:inherit;color:inherit}
textarea{resize:none;font:500 22px/28px "Caveat","Segoe Print",cursive;padding:0;
  background:repeating-linear-gradient(to bottom,transparent 0 27px,#8d6e6a 27px 28px) local}
input[type=date]{font:500 22px "Caveat","Segoe Print",cursive;padding:0}
.amen{text-align:center;font-weight:600;font-size:24px;margin-top:4px}
/* Fila inferior: "Hoy oro por" + el osito dentro de un círculo */
.bottom{display:flex;gap:14px;align-items:flex-end}
.bottom .box{flex:1}
.bear{flex:none;position:relative;width:170px;height:153px}
.bear svg{position:absolute;inset:0;width:100%;height:100%}
.bear img{position:absolute;left:25%;top:18%;width:50%;height:auto}
#ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;color:#fff}
#ov[hidden]{display:none}
#ov img{max-width:90vw;max-height:62vh;background:#fff}
#ov button{background:#b98a9c;color:#fff;border:0;border-radius:999px;padding:10px 20px;font-size:15px;cursor:pointer}

@media print{ #sheet{transform:none!important} .stage{height:auto!important;overflow:visible} #ov{display:none} .bar,.msg{display:none} body{background:#fff} .wrap{padding:0} }


/* ---------- AJUSTE VISUAL: más cercano a la hoja de referencia ---------- */
#sheet{
  position:relative;
  isolation:isolate;
  --alfa:.92; /* opacidad de las cajas (1 = sólidas) */
  border:1px solid rgba(202,158,177,.35);
}
.title{
  position:relative;
  padding:17px 12px;
  background:rgba(222,198,222,.72);
  border:7px solid #c5a9c7;
  outline:2px solid rgba(177,137,173,.55);
  outline-offset:5px;
  box-shadow:inset 0 0 0 5px rgba(255,245,241,.75);
  color:#171216;
  font-size:42px;
  letter-spacing:.1px;
  margin:4px 5px 8px;
}
.title b{
  color:#e6d7e9;
  -webkit-text-stroke:2.4px #171216;
  paint-order:stroke fill;
  letter-spacing:3px;
  font-size:1em;
}
.box{
  background:rgba(233,189,179,var(--alfa,.92));
  padding:0 11px 11px;
  border:1px solid rgba(190,139,132,.12);
  box-shadow:0 1px 0 rgba(255,255,255,.42) inset;
}
.box h3{
  display:block;
  margin:0 -11px 9px;
  padding:7px 8px 6px;
  min-height:40px;
  box-sizing:border-box;
  background:transparent;
  color:#171216;
  text-align:center;
  font-family:"Fredoka","Trebuchet MS",sans-serif;
  font-size:27px;
  line-height:1.15;
  font-weight:600;
}
.left{gap:12px}
.week{gap:7px;padding:1px 0}
.week button{
  width:39px;height:39px;
  background:#d8c5df;
  color:#201820;
  font-size:17px;
  box-shadow:0 1px 2px rgba(66,42,62,.12);
}
.week button:nth-child(even){background:#edc4bd}
.week button.on{background:#8d6b96;color:#fff;box-shadow:0 0 0 2px #f7e8ed}
.round{
  border-radius:46px 42px 48px 44px;
  padding:15px 19px 18px;
  background:rgba(234,187,177,var(--alfa,.92));
  clip-path:none;
}
.round h3{
  margin:0 -8px 9px;
  padding:5px 8px 8px;
  background:transparent;
  min-height:0;
  font-size:28px;
}
textarea{
  color:#30252a;
  outline:none;
  border-radius:2px;
  background:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(126,94,91,.72) 27px 28px) local;
}
textarea:focus,input[type=date]:focus{
  filter:drop-shadow(0 1px 0 rgba(124,83,111,.18));
}
.amen{color:#211820;font-size:25px}
.bottom .box h3{text-align:left;padding-left:15px}
.bear{filter:drop-shadow(0 2px 2px rgba(95,65,95,.08))}
@media(max-width:520px){
  .bar{position:sticky;top:0;z-index:10;background:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .bar button{font-size:13px;padding:9px 13px}
}

/* ==========================================================
   V6 — PALETA LAVANDA / MALVA
   Inspirada en el fondo lila y el osito morado.
   Se mantienen intactos el diseño estructural y las funciones.
   ========================================================== */
:root{
  --bg:#f5eff8;
  --txt:#493452;
  --btn:#79518f;
  --btn-txt:#fff;
}

/* Título: lavanda suave con contorno violeta */
.title{
  background:rgba(222,205,235,.88);
  border-color:#a98cbd;
  outline-color:rgba(119,78,145,.42);
  box-shadow:inset 0 0 0 5px rgba(255,250,255,.78);
  color:#392346;
}
.title b{
  color:#f3eafa;
  -webkit-text-stroke:2.4px #4d2d62;
}

/* Cuadros: reemplazo del tono durazno por lavanda claro */
.box,
.round{
  background:rgba(235,225,244,.94);
  border:1px solid rgba(117,79,145,.22);
  box-shadow:
    0 3px 10px rgba(73,48,91,.07),
    0 1px 0 rgba(255,255,255,.82) inset;
}
.box h3{
  color:#513267;
}

/* Días de la semana: misma familia cromática */
.week button{
  background:#e4d6ed;
  color:#493052;
  box-shadow:0 1px 3px rgba(73,48,91,.13);
}
.week button:nth-child(even){
  background:#eee2ef;
}
.week button.on{
  background:#79518f;
  color:#fff;
  box-shadow:0 0 0 2px #f8f1fb, 0 2px 5px rgba(73,48,91,.18);
}

/* Escritura y detalles */
textarea{
  color:#382b40;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0 27px,
    rgba(126,96,145,.52) 27px 28px
  ) local;
}
.amen{color:#5b3970}
textarea:focus,input[type=date]:focus{
  filter:drop-shadow(0 1px 1px rgba(105,69,132,.22));
}

/* Botones exteriores y ventana de vista previa */
.bar button,#ov button{
  background:#79518f;
  color:#fff;
}
.bar button:hover,#ov button:hover{
  background:#654078;
}
.msg{color:#624c70}

/* Conserva una hoja limpia al imprimir */
@media print{
  .bar button,#ov button{background:#79518f}
}

body{background:var(--bg);color:var(--txt)}
.msg{color:var(--txt)}

/* Botones exteriores: respuesta suave */
.bar button,#ov button{background:var(--btn);color:#fff;transition:background .2s,transform .15s,box-shadow .2s}
.bar button:hover,#ov button:hover{background:var(--txt);transform:translateY(-1px);box-shadow:0 4px 10px rgba(81,50,103,.22)}
.bar button:active,#ov button:active{transform:translateY(0) scale(.97);box-shadow:none}
.bar button:focus-visible,.week button:focus-visible{outline:3px solid rgba(152,116,173,.55);outline-offset:2px}

/* TÍTULO: caligráfico, con destellos muy suaves */
.title{
  position:relative;overflow:hidden;
  background:
    var(--destellos) center 0/100% auto no-repeat,
    linear-gradient(180deg,rgba(240,232,247,.96),rgba(228,214,237,.94));
  border:5px solid var(--malva);
  outline:1.5px solid rgba(152,116,173,.45);outline-offset:5px;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.7),0 3px 10px rgba(81,50,103,.08);
  color:var(--txt);border-radius:26px;
}
.title b{color:#f7f2fa;-webkit-text-stroke:2.4px var(--txt);paint-order:stroke fill}

/* TARJETAS: lavanda, bordes redondeados, textura de papel y esquina floral */
.box,.round{
  position:relative;overflow:hidden;
  background:
    linear-gradient(rgba(247,242,250,.93),rgba(247,242,250,.93)),
    var(--papel);
  background-size:auto,256px 256px;
  border:1.5px solid rgba(205,182,222,.95);
  border-radius:24px;
  box-shadow:0 2px 8px rgba(81,50,103,.08),0 1px 0 rgba(255,255,255,.9) inset;
  transition:transform .25s ease,box-shadow .25s ease;
}
.round{padding:0 16px 14px;border-radius:30px}
.box::before{            /* esquina de lavanda (solo en la zona del título, nunca sobre las líneas de escribir) */
  content:"";position:absolute;left:-2px;top:-2px;width:74px;height:75px;
  background:var(--esquina) 0 0/100% 100% no-repeat;opacity:.8;pointer-events:none;
}
.box h3,.round h3{
  position:relative;color:var(--txt);font-size:24px;
  margin:0 -11px 12px;padding:9px 8px 8px;min-height:0;
}
.box h3::after{          /* separador delicado bajo el título */
  content:"";display:block;width:54px;height:2px;margin:6px auto 0;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--violeta),transparent);opacity:.8;
}
.bottom .box h3{text-align:left;padding-left:52px}
.bottom .box h3::after{margin-left:52px;margin-right:0;background:linear-gradient(90deg,var(--violeta),transparent)}
.round h3::after{margin-top:6px}
@media(hover:hover){
  .box:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(81,50,103,.13),0 1px 0 rgba(255,255,255,.9) inset}
}

/* DÍAS: el seleccionado se distingue con claridad */
.week{gap:6px}
.week button{
  background:var(--lav);color:var(--txt);
  box-shadow:0 1px 3px rgba(81,50,103,.14);
  transition:transform .15s,background .2s,box-shadow .2s;
}
.week button:nth-child(even){background:#efe6f4}
@media(hover:hover){.week button:hover{transform:translateY(-1px);background:var(--malva)}}
.week button.on{
  background:var(--txt);color:#fff;transform:scale(1.12);
  box-shadow:0 0 0 3px #fff,0 0 0 5px var(--violeta),0 3px 8px rgba(81,50,103,.25);
}

/* ESCRITURA: letra manuscrita oscura y líneas suaves */
textarea,input[type=date]{color:var(--tinta);caret-color:var(--violeta);transition:background-color .25s,box-shadow .25s}
textarea{
  position:relative;z-index:1;border-radius:6px;
  background-color:transparent;
  background-image:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(152,116,173,.5) 27px 28px);
  background-attachment:local;
}
textarea:focus,input[type=date]:focus{
  outline:none;filter:none;
  background-color:rgba(255,255,255,.55);
  box-shadow:0 0 0 4px rgba(205,182,222,.55);
}
textarea::selection,input::selection{background:rgba(152,116,173,.3)}
.amen{color:var(--violeta);font-size:24px}

/* OSITO: integrado con un halo suave y destellos */
.bottom{align-items:flex-end}
.bear{position:relative;width:150px;filter:none}
.bear::before{
  content:"";position:absolute;left:-14px;right:-14px;top:-12px;bottom:-6px;z-index:0;
  background:
    var(--destellos) center -6px/150% auto no-repeat,
    radial-gradient(circle at 50% 58%,rgba(205,182,222,.55) 0,rgba(228,214,237,.35) 55%,transparent 72%);
  opacity:.95;
}
.bear img{position:relative;z-index:1;filter:drop-shadow(0 3px 4px rgba(81,50,103,.14))}


/* ===== V7.1 — LEGIBILIDAD PRIMERO: letras más oscuras, más grandes y sin nada encima ===== */
:root{--txt:#3a2150;--tinta:#23132f}
.title{color:#2e1a42;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.title{background:linear-gradient(180deg,rgba(244,238,250,.98),rgba(232,220,241,.97))}
.title::before{content:"";position:absolute;inset:0;background:var(--destellos) center 0/100% auto no-repeat;opacity:.45;pointer-events:none}
.title b{color:#3a2150;-webkit-text-stroke:0;paint-order:normal;font-weight:600;letter-spacing:3px;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.box::before{width:44px;height:45px;opacity:.5;z-index:0}
.box h3,.round h3{z-index:1;font-size:27px;color:#3a2150;text-shadow:0 0 5px #f7f2fa,0 0 5px #f7f2fa}
.box h3::after{background:linear-gradient(90deg,transparent,#7b5896,transparent);opacity:1}
textarea,input[type=date]{color:#23132f}
textarea{font:500 24px/28px "Caveat","Segoe Print",cursive;-webkit-text-stroke:.5px #23132f;
  background-image:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(152,116,173,.32) 27px 28px)}
input[type=date]{font:500 24px "Caveat","Segoe Print",cursive;-webkit-text-stroke:.5px #23132f}
.amen{color:#6b4585;font-size:26px}
.week button{color:#3a2150;font-weight:600}


/* ===== V7.2 — SIN MODO OSCURO: la hoja y la página siempre usan la paleta lavanda ===== */
:root,:root:not([data-theme="light"]){--bg:#f7f2fa;--txt:#3a2150;--btn:#7b5896;color-scheme:light}
#sheet{--txt:#3a2150;--tinta:#23132f;--lav:#e4d6ed;--malva:#cdb6de;--violeta:#9874ad}
body{background:#f7f2fa;color:#3a2150}

const KEY = "diarioOracion.v1";
const sheet = document.getElementById("sheet");
const msg = t => { document.getElementById("msg").textContent = t; };
let data = {};
try { data = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };

/* ---------- DÍAS DE LA SEMANA (D L M M J V S) ---------- */
const week = document.getElementById("week");
"DLMMJVS".split("").forEach((l, i) => {
  const b = document.createElement("button");
  b.textContent = l;
  b.onclick = () => { data.dia = i; save(); paintWeek(); };
  week.appendChild(b);
});
function paintWeek() {
  [...week.children].forEach((b, i) => b.classList.toggle("on", data.dia === i));
}

/* ---------- CAMPOS: cargar lo guardado y guardar al escribir ---------- */
const fields = sheet.querySelectorAll("[data-k]");
fields.forEach(f => {
  f.value = data[f.dataset.k] || "";
  f.addEventListener("input", () => { data[f.dataset.k] = f.value; save(); });
});
/* ---------- CALENDARIO -> LETRA DEL DÍA ----------
   El <input type="date"> entrega "2026-11-23". Se separa en partes y se crea la fecha con
   new Date(año, mes-1, día) (los meses empiezan en 0). getDay() devuelve 0=domingo ... 6=sábado. */
const fechaInput = sheet.querySelector('[data-k="fecha"]');
fechaInput.addEventListener("input", () => {
  const p = fechaInput.value.split("-");
  if (p.length === 3) { data.dia = new Date(+p[0], +p[1] - 1, +p[2]).getDay(); save(); paintWeek(); }
});
// Primera vez: poner la fecha de hoy y marcar el día de la semana
if (!data.fecha) {
  const d = new Date();
  data.fecha = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  data.dia = d.getDay(); // 0 = domingo
  sheet.querySelector('[data-k="fecha"]').value = data.fecha;
  save();
}
paintWeek();

/* ---------- HOJA NUEVA ---------- */
document.getElementById("bClear").onclick = () => {
  if (!confirm("¿Borrar todo y empezar una hoja nueva?")) return;
  try { localStorage.removeItem(KEY); } catch (e) {}
  location.reload();
};

/* ---------- AJUSTE AL CELULAR ----------
   Calcula cuánto hay que reducir la hoja (de 735px) para que quepa en la pantalla. */
const stage = document.getElementById("stage");
function fit() {
  const k = Math.min(1, stage.clientWidth / 735);
  sheet.style.transform = "scale(" + k + ")";
  stage.style.height = Math.ceil(sheet.offsetHeight * k) + "px";
}
fit(); addEventListener("resize", fit);
if (document.fonts) document.fonts.ready.then(fit);

/* ---------- GENERAR IMAGEN ----------
   Se captura la hoja SIN reducir (transform:none) y al doble de resolución. */
const makePng = () => { if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  return htmlToImage.toPng(sheet, {
  pixelRatio: 2, backgroundColor: "#f8f3fa",
  width: 735, height: sheet.offsetHeight, style: { transform: "none" }
}); };
// Convierte "data:image/png;base64,..." en un archivo (Blob) sin usar fetch
function dataToBlob(u) {
  const p = u.split(","), mime = p[0].match(/:(.*?);/)[1], bin = atob(p[1]);
  const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], { type: mime });
}
const nombreBase = () => "diario-oracion-" + (data.fecha || "hoy");
const errTxt = e => (e && (e.message || e.code || e.type)) || String(e);

/* ---------- VISTA PREVIA + GUARDAR ----------
   Primero se muestra el resultado. El botón "Guardar" es un clic nuevo del usuario,
   que es lo que el navegador exige para permitir una descarga.
   Plan B: mantener presionada la imagen (celular) para guardarla. */
const ov = document.getElementById("ov");
function ofrecer(nombre, blob, previewUrl, ayuda) {
  document.getElementById("ovImg").src = previewUrl;
  document.getElementById("ovTxt").textContent = ayuda;
  ov.hidden = false;
  document.getElementById("ovSave").onclick = async () => {
    try {
      let dl = null;
      try { dl = await claude.use("downloads"); } catch (e) {}
      if (dl) { await dl.save({ filename: nombre, data: blob }); msg("Listo ✔"); }
      else {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = nombre; a.click();
        msg("Si no se descargó, mantén presionada la imagen y elige Guardar.");
      }
    } catch (e) {
      if (e && e.code === "declined") return;
      msg("No se pudo guardar (" + errTxt(e) + "). Mantén presionada la imagen para guardarla.");
    }
  };
}
document.getElementById("ovClose").onclick = () => { ov.hidden = true; };

document.getElementById("bPng").onclick = async () => {
  try {
    msg("Creando imagen…");
    const url = await makePng();
    msg("");
    ofrecer(nombreBase() + ".png", dataToBlob(url), url, "Toca Guardar, o mantén presionada la imagen.");
  } catch (e) { msg("No se pudo crear la imagen: " + errTxt(e)); }
};

document.getElementById("bPdf").onclick = async () => {
  try {
    msg("Creando PDF…");
    const url = await makePng();
    const pdf = new jspdf.jsPDF({ unit: "mm", format: "a4" });
    const w = 190, h = w * sheet.offsetHeight / 735; // mantiene la proporción
    pdf.addImage(url, "PNG", 10, 10, w, h);
    msg("");
    ofrecer(nombreBase() + ".pdf", pdf.output("blob"), url, "Vista previa del PDF. Toca Guardar.");
  } catch (e) { msg("No se pudo crear el PDF: " + errTxt(e)); }
};

document.getElementById("bPrint").onclick = () => window.print();
</script>
</body>
</html>
